<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>MexiSonora X Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#0f1226;
color:white;
margin:0;
}

header{
background:#151a3a;
padding:25px;
text-align:center;
}

.container{
width:95%;
margin:auto;
margin-top:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:#1c2148;
padding:20px;
border-radius:10px;
text-align:center;
}

.card h3{
margin:0;
color:#9fb3ff;
}

.card p{
font-size:28px;
}

textarea{
width:45%;
height:200px;
margin:10px;
padding:10px;
border-radius:8px;
border:none;
}

button{
padding:12px 25px;
background:#1da1f2;
border:none;
border-radius:6px;
color:white;
font-size:16px;
cursor:pointer;
}

.section{
margin-top:30px;
}

ul{
text-align:left;
width:60%;
margin:auto;
}

canvas{
margin-top:40px;
}

footer{
margin-top:60px;
padding:20px;
background:#151a3a;
text-align:center;
font-size:14px;
color:#9fb3ff;
}

</style>

</head>

<body>

<header>

<h1>MexiSonora Analytics</h1>

<p>Herramienta de análisis para cuentas de X</p>

</header>

<div class="container">

<div class="dashboard">

<div class="card">
<h3>Sigues</h3>
<p id="sigues">0</p>
</div>

<div class="card">
<h3>Seguidores</h3>
<p id="seguidores">0</p>
</div>

<div class="card">
<h3>No te siguen</h3>
<p id="nosiguen">0</p>
</div>

<div class="card">
<h3>Ratio</h3>
<p id="ratio">0</p>
</div>

</div>

<div class="section">

<h2>Usuarios que sigues</h2>

<textarea id="following" placeholder="pega aquí las cuentas que sigues"></textarea>

<h2>Tus seguidores</h2>

<textarea id="followers" placeholder="pega aquí tus seguidores"></textarea>

<br>

<button onclick="analizar()">Analizar cuenta</button>

</div>

<div class="section">

<h2>Cuentas que no te siguen de vuelta</h2>

<ul id="lista"></ul>

</div>

<canvas id="chart"></canvas>

</div>

<footer>

App creada por  
<strong>@MexiSonora</strong>

</footer>

<script>

function analizar(){

let following=document.getElementById("following").value
.split("\\n")
.map(x=>x.trim())
.filter(x=>x);

let followers=document.getElementById("followers").value
.split("\\n")
.map(x=>x.trim())
.filter(x=>x);

document.getElementById("sigues").innerText=following.length;

document.getElementById("seguidores").innerText=followers.length;

let noSiguen=following.filter(u=>!followers.includes(u));

document.getElementById("nosiguen").innerText=noSiguen.length;

let ratio=(followers.length/following.length).toFixed(2);

document.getElementById("ratio").innerText=ratio;

let lista=document.getElementById("lista");

lista.innerHTML="";

noSiguen.forEach(user=>{

let li=document.createElement("li");

li.textContent=user;

lista.appendChild(li);

});

graficar(followers.length,following.length);

}

function graficar(seguidores,siguiendo){

let ctx=document.getElementById("chart");

new Chart(ctx,{

type:"doughnut",

data:{
labels:["Seguidores","Siguiendo"],
datasets:[{
data:[seguidores,siguiendo]
}]
}

});

}

</script>

</body>

</html>
